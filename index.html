<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sarah's Camino del Norte</title>
  <meta name="description" content="Follow Sarah's 40-day pilgrimage along the Camino del Norte — Spain's coastal route from Irún to Santiago de Compostela.">

  <!-- Don't index this personal page in search engines -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Theme color for mobile browser chrome (matches the Camino blue) -->
  <meta name="theme-color" content="#003399">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- OpenGraph (iMessage, WhatsApp, Facebook, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sarah's Camino del Norte">
  <meta property="og:title" content="Sarah's Camino del Norte">
  <meta property="og:description" content="Follow Sarah's 40-day pilgrimage along Spain's northern coast — Irún to Santiago de Compostela. Daily photos and progress on an interactive map.">
  <meta property="og:url" content="https://mikus31.github.io/sarah-camino/">
  <meta property="og:image" content="https://mikus31.github.io/sarah-camino/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Map of northern Spain showing Sarah's Camino del Norte route from Irún to Santiago.">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sarah's Camino del Norte">
  <meta name="twitter:description" content="Follow Sarah's 40-day pilgrimage along Spain's northern coast — Irún to Santiago de Compostela.">
  <meta name="twitter:image" content="https://mikus31.github.io/sarah-camino/og-image.jpg">

  <!-- Leaflet CSS -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">

  <style>
    :root {
      --ink: #2b2118;
      --cream: #f7f1e8;
      --camino-blue: #003399;
      --camino-blue-soft: rgba(0, 51, 153, 0.18);
      --camino-yellow: #FFCC00;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--ink); }
    #map { position: absolute; inset: 0; }

    /* Header card */
    .banner {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 500;
      background: var(--cream);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      max-width: 320px;
      line-height: 1.35;
    }
    .banner h1 {
      margin: 0 0 2px 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .banner .sub { font-size: 13px; color: #6b5a48; }
    .banner .stats {
      margin-top: 8px;
      display: flex;
      gap: 14px;
      font-size: 13px;
    }
    .banner .stats b { color: var(--camino-blue); font-weight: 700; }
    .banner .time {
      margin-top: 6px;
      font-size: 12px;
      color: #8b7765;
      font-variant-numeric: tabular-nums;
    }
    .banner .time b { color: var(--camino-blue); font-weight: 600; }

    /* Legend (bottom-left) */
    .legend {
      position: absolute;
      bottom: 22px;
      left: 14px;
      z-index: 500;
      background: var(--cream);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
      font-size: 12px;
      line-height: 1.6;
    }
    .legend .row { display: flex; align-items: center; gap: 8px; }
    .legend .swatch {
      display: inline-block;
      width: 18px;
      height: 10px;
      border-radius: 2px;
    }
    /* "Full route" swatch: a dashed line approximation of how the unwalked
       portion appears on the map. Same Camino blue as the walked line, but
       dashed and at lower opacity to convey "still to come". */
    .legend .swatch-dashed {
      background: transparent;
      border-radius: 0;
      border-top: 3px dashed var(--camino-blue);
      opacity: 0.65;
      align-self: center;
      height: 0;
    }
    .legend .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.25);
    }

    /* Popup styling */
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      padding: 0;
    }
    .leaflet-popup-content {
      margin: 0;
      width: 260px !important;
    }
    .day-popup { font-family: inherit; color: var(--ink); }
    .day-popup img {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px 10px 0 0;
      background: #ddd;
      cursor: zoom-in;
    }

    /* Lightbox overlay */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(20, 15, 10, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px;
      box-sizing: border-box;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 100%;
      max-height: calc(100% - 120px);
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    #lightbox-caption {
      color: var(--cream);
      font-size: 14px;
      margin-top: 16px;
      max-width: 720px;
      text-align: center;
      line-height: 1.5;
    }
    #lightbox-caption .loc {
      display: block;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      font-size: 15px;
    }
    #lightbox-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: transparent;
      color: var(--cream);
      font-size: 36px;
      border: none;
      cursor: pointer;
      line-height: 1;
      padding: 4px 10px;
      font-family: inherit;
    }
    #lightbox-close:hover { color: #fff; }

    #lightbox-prev, #lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.15s, opacity 0.15s;
      z-index: 1;
    }
    #lightbox-prev { left: 18px; }
    #lightbox-next { right: 18px; }
    #lightbox-prev:hover, #lightbox-next:hover { background: rgba(0, 0, 0, 0.75); }
    #lightbox-prev[disabled], #lightbox-next[disabled] {
      opacity: 0.25;
      cursor: default;
      pointer-events: none;
    }
    #lightbox-prev svg, #lightbox-next svg {
      width: 28px;
      height: 28px;
      stroke: #fff;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (max-width: 520px) {
      #lightbox-prev, #lightbox-next { width: 48px; height: 48px; }
      #lightbox-prev { left: 8px; }
      #lightbox-next { right: 8px; }
    }
    .day-popup .pad { padding: 10px 12px 12px 12px; }
    .day-popup .hdr {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      padding-right: 22px; /* reserve space for Leaflet's close X */
    }
    .day-popup .day {
      font-size: 13px;
      font-weight: 700;
      color: var(--camino-blue);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .day-popup .date { font-size: 12px; color: #6b5a48; }
    .day-popup .loc { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .day-popup .caption { font-size: 13px; line-height: 1.45; color: #3a2d22; }
    .day-popup .miles { font-size: 11px; color: #8b7765; margin-top: 6px; }

    /* Countdown block, shown inside the Day 0 popup pre-departure */
    .day-popup .countdown {
      margin: 8px 0 4px;
      padding: 10px 8px;
      background: var(--camino-blue-soft);
      border-radius: 6px;
      text-align: center;
      line-height: 1.15;
    }
    .day-popup .countdown .cnt-num {
      font-size: 22px;
      font-weight: 700;
      color: var(--camino-blue);
    }
    .day-popup .countdown .cnt-sub {
      font-size: 11px;
      color: #6b5a48;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }

    /* Current-day pulsing marker */
    .current-marker {
      width: 22px;
      height: 22px;
      background: var(--camino-yellow);
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(255, 204, 0, 0.7);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7); }
      70%  { box-shadow: 0 0 0 22px rgba(255, 204, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
    }
    .past-marker {
      width: 12px;
      height: 12px;
      background: var(--camino-yellow);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
    }

    /* Responsive: shrink banner on phones */
    @media (max-width: 520px) {
      .banner { max-width: calc(100% - 40px); }
      .legend { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="banner">
    <h1 id="banner-title">Camino del Norte</h1>
    <div class="sub" id="banner-sub">Loading journey…</div>
    <div class="stats" id="banner-stats"></div>
    <div class="time" id="banner-time"></div>
  </div>

  <div class="legend">
    <div class="row"><span class="swatch swatch-dashed" aria-hidden="true"></span>Full route</div>
    <div class="row"><span class="swatch" style="background: var(--camino-blue);"></span>Walked so far</div>
    <div class="row"><span class="dot" style="background: var(--camino-yellow);"></span>Past day (click!)</div>
    <div class="row"><span class="dot" style="background: var(--camino-yellow); width: 14px; height: 14px;"></span>Most recent day</div>
  </div>

  <!-- Lightbox overlay (hidden until a photo is clicked) -->
  <div id="lightbox" aria-hidden="true" role="dialog">
    <button id="lightbox-close" aria-label="Close">&times;</button>
    <button id="lightbox-prev" aria-label="Previous day">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <button id="lightbox-next" aria-label="Next day">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <img id="lightbox-img" alt="">
    <div id="lightbox-caption"></div>
  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <!-- Turf.js for nearest-point-on-line / line-slicing -->
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <script>
    // -------------------------------------------------------------
    // CONFIG - paste your keys here (see README for how to get them)
    // -------------------------------------------------------------
    const CONFIG = {
      MAPTILER_KEY: "emnksKueX1bIKbJb2CSR",
      MAPBOX_TOKEN: "pk.eyJ1IjoibWlrdXMzMSIsImEiOiJjbW9hNjB4N28wM21uMnFvaWQ1azNpdnNuIn0.8JL2073-UWgbSYFdN4VkyA"
    };

    // Shared: the full sorted list of journal entries (used by both markers and the lightbox)
    var allEntries = [];
    var journalStartDate = "";   // set from journal.json; drives the Day 0 countdown
    var journalPilgrim = "";

    // Returns { days: N, pretty: "June 18" } where days is whole-day diff
    // from local today to startDate (positive = future). Null if invalid.
    function startsInText(startDateStr) {
      if (!startDateStr) return null;
      var parts = String(startDateStr).split("-");
      if (parts.length !== 3) return null;
      var start = new Date(+parts[0], +parts[1] - 1, +parts[2]);
      if (isNaN(start)) return null;
      var now = new Date();
      var startDay = new Date(start.getFullYear(), start.getMonth(), start.getDate());
      var nowDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var days = Math.round((startDay - nowDay) / 86400000);
      var pretty = start.toLocaleDateString("en-US", { month: "long", day: "numeric" });
      return { days: days, pretty: pretty };
    }

    // -------------------------------------------------------------
    // INIT MAP
    // -------------------------------------------------------------
    const map = L.map("map", {
      zoomControl: false,
      scrollWheelZoom: true
    }).setView([43.3, -4.8], 7);

    L.control.zoom({ position: "topright" }).addTo(map);

    // -------------------------------------------------------------
    // BASEMAPS
    // -------------------------------------------------------------
    const esriTopo = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Tiles &copy; Esri",
        maxZoom: 17
      }
    );

    const esriImagery = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Tiles &copy; Esri",
        maxZoom: 19
      }
    );

    function makeEsriLabelsOverlay() {
      return L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
        {
          attribution: "Labels &copy; Esri",
          maxZoom: 19,
          pane: "overlayPane"
        }
      );
    }

    const esriImageryLabeled = L.layerGroup([esriImagery, makeEsriLabelsOverlay()]);

    // MapTiler Aquarelle (retina-sharp 512px tiles)
    const maptilerAquarelle = L.tileLayer(
      "https://api.maptiler.com/maps/aquarelle/{z}/{x}/{y}.png?key=" + CONFIG.MAPTILER_KEY,
      {
        attribution: '\u0026copy; <a href="https://www.maptiler.com/copyright/" target="_blank">MapTiler</a> \u0026copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>',
        maxZoom: 18,
        tileSize: 512,
        zoomOffset: -1,
        crossOrigin: true
      }
    );

    // Esri Satellite + Labels as default (no key required)
    esriImageryLabeled.addTo(map);

    const baseLayers = {
      "Esri Satellite + Labels": esriImageryLabeled,
      "Esri Topographic": esriTopo
    };
    if (CONFIG.MAPTILER_KEY) {
      baseLayers["MapTiler Aquarelle"] = maptilerAquarelle;
    }

    L.control.layers(baseLayers, null, { position: "topright", collapsed: true }).addTo(map);

    // -------------------------------------------------------------
    // LOAD DATA
    // -------------------------------------------------------------
    Promise.all([
      fetch("data/route.geojson").then(r => r.json()),
      fetch("data/journal.json").then(r => r.json())
    ]).then(([routeData, journal]) => {
      renderTrip(routeData, journal);
    }).catch(err => {
      console.error(err);
      document.getElementById("banner-sub").textContent =
        "Could not load route or journal data. See console.";
    });

    // -------------------------------------------------------------
    // RENDER
    // -------------------------------------------------------------
    function renderTrip(routeData, journal) {
      // 1. Draw the full route as a faint dashed Camino blue line. Same color
      //    as the bold walked-so-far line below, but dashed and lower-opacity
      //    so the visual reads as a progress bar: solid = walked, faint = still to come.
      const fullRoute = L.geoJSON(routeData, {
        attribution: 'Route &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
        style: {
          color: "#003399",          // matches --camino-blue / walked-line color
          weight: 3,
          opacity: 0.65,
          dashArray: "6 5",
          lineCap: "round"
        }
      }).addTo(map);

      // Fit map to the route
      map.fitBounds(fullRoute.getBounds(), { padding: [40, 40] });

      // 2. Compute the "walked so far" portion of the route using turf
      const entries = (journal.entries || []).slice().sort((a, b) => a.day - b.day);
      allEntries = entries;
      journalStartDate = journal.startDate || "";
      journalPilgrim = journal.pilgrim || "";
      const walkedEntries = entries.filter(function (e) { return e.day >= 1; });
      const routeLine = routeData.features[0];          // Turf expects a Feature<LineString>
      const startPt = turf.point(routeLine.geometry.coordinates[0]);

      // Only draw the walked-line once at least one walking day has happened.
      // Pre-launch (only Day 0), there's nothing to draw.
      if (walkedEntries.length > 0) {
        const latest = walkedEntries[walkedEntries.length - 1];
        const latestPt = turf.point([latest.coords[1], latest.coords[0]]);  // [lng, lat]
        const snapped = turf.nearestPointOnLine(routeLine, latestPt, { units: "kilometers" });
        const walked = turf.lineSlice(startPt, snapped, routeLine);

        L.geoJSON(walked, {
          style: {
            color: "#003399",
            weight: 5,
            opacity: 0.95,
            lineCap: "round",
            lineJoin: "round"
          }
        }).addTo(map);
      }

      // 3. Markers for each day's entry
      const mostRecentDay = entries.length > 0 ? entries[entries.length - 1].day : null;

      entries.forEach(entry => {
        const isRecent = entry.day === mostRecentDay;
        const icon = L.divIcon({
          className: "",
          html: '<div class="' + (isRecent ? "current-marker" : "past-marker") + '"></div>',
          iconSize: isRecent ? [22, 22] : [12, 12],
          iconAnchor: isRecent ? [11, 11] : [6, 6]
        });

        const marker = L.marker(entry.coords, {
          icon: icon,
          zIndexOffset: isRecent ? 1000 : 0,
          riseOnHover: true
        }).addTo(map);

        marker.bindPopup(buildPopup(entry), {
          maxWidth: 280,
          minWidth: 260,
          closeButton: true,
          autoPan: true
        });

        // Auto-open the most recent day's popup on load
        if (isRecent) {
          setTimeout(function () { marker.openPopup(); }, 600);
        }
      });

      // 4. Update the banner with stats. Day 0 doesn't count as "walked".
      const totalDays = walkedEntries.length;
      const totalKm = walkedEntries.reduce(function (s, e) { return s + (e.distanceKm || 0); }, 0);
      const totalMiles = kmToMiles(totalKm);
      document.getElementById("banner-title").textContent =
        (journalPilgrim ? journalPilgrim + " \u2014 " : "") + "Camino del Norte";
      renderBannerSub();
      document.getElementById("banner-stats").innerHTML = totalDays
        ? "<div>Day <b>" + totalDays + "</b></div><div><b>" + totalMiles + "</b> miles walked</div>"
        : "";
    }

    // Banner subtitle: countdown pre-launch, "Latest: ..." once walking.
    // Pulled out so it can be ticked from the clock interval.
    function renderBannerSub() {
      var el = document.getElementById("banner-sub");
      if (!el) return;
      var walked = (allEntries || []).filter(function (e) { return e.day >= 1; });
      if (walked.length > 0) {
        el.textContent = "Latest: " + walked[walked.length - 1].location;
        return;
      }
      var c = startsInText(journalStartDate);
      if (!c) { el.textContent = "Planning the journey\u2026"; return; }
      if (c.days > 1) el.textContent = "Starts in " + c.days + " days \u00b7 " + c.pretty;
      else if (c.days === 1) el.textContent = "Starts tomorrow \u00b7 " + c.pretty;
      else if (c.days === 0) el.textContent = "Walking today! \u00b7 " + c.pretty;
      else el.textContent = "Underway since " + c.pretty;
    }

    // Live Spain clock in the banner \u2014 uses Europe/Madrid so DST is automatic.
    function renderSpainClock() {
      var el = document.getElementById("banner-time");
      if (!el) return;
      try {
        var fmt = new Intl.DateTimeFormat("en-US", {
          timeZone: "Europe/Madrid",
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
          timeZoneName: "short"
        });
        var parts = fmt.formatToParts(new Date());
        var time = "", ampm = "", tzName = "";
        parts.forEach(function (p) {
          if (p.type === "hour" || p.type === "minute" || p.type === "literal") time += p.value;
          else if (p.type === "dayPeriod") ampm = p.value;
          else if (p.type === "timeZoneName") tzName = p.value;
        });
        el.innerHTML = "\ud83d\udd52 <b>" + time.trim() + " " + ampm + "</b> in Spain \u00b7 " + tzName;
      } catch (e) {
        el.textContent = "";
      }
    }
    renderSpainClock();
    setInterval(function () {
      renderSpainClock();
      renderBannerSub();   // keep the countdown fresh if the page is left open
    }, 30 * 1000);

    // Distance helper: km -> miles, rounded to 1 decimal (or whole number if >= 100)
    function kmToMiles(km) {
      if (!km) return 0;
      const mi = km * 0.621371;
      return mi >= 100 ? Math.round(mi) : Math.round(mi * 10) / 10;
    }

    function buildPopup(e) {
      const hasPhoto = e.photo && e.photo.length > 0;
      const photoHtml = hasPhoto
        ? '<img data-day="' + e.day + '" src="' + escapeHtml(e.photo) + '" alt="' + escapeHtml(e.location || "") + '" onerror="this.style.display=\'none\'">'
        : "";
      const miles = e.distanceKm ? '<div class="miles">' + kmToMiles(e.distanceKm) + ' miles walked</div>' : "";
      const dayLabel = e.day === 0 ? "Start" : "Day " + e.day;

      // For Day 0, prepend a live countdown to departure.
      let countdownHtml = "";
      if (e.day === 0) {
        const c = startsInText(journalStartDate);
        if (c) {
          let num, sub;
          if (c.days > 1) { num = c.days + " days"; sub = "until departure"; }
          else if (c.days === 1) { num = "Tomorrow"; sub = "she starts walking"; }
          else if (c.days === 0) { num = "Today!"; sub = "the journey begins"; }
          else { num = "Underway"; sub = "the journey has begun"; }
          countdownHtml =
            '<div class="countdown">' +
              '<div class="cnt-num">' + num + '</div>' +
              '<div class="cnt-sub">' + sub + '</div>' +
            '</div>';
        }
      }

      return (
        '<div class="day-popup">' +
          photoHtml +
          '<div class="pad">' +
            '<div class="hdr">' +
              '<span class="day">' + dayLabel + '</span>' +
              '<span class="date">' + escapeHtml(e.date || "") + '</span>' +
            '</div>' +
            '<div class="loc">' + escapeHtml(e.location || "") + '</div>' +
            countdownHtml +
            '<div class="caption">' + escapeHtml(e.caption || "") + '</div>' +
            miles +
          '</div>' +
        '</div>'
      );
    }

    function escapeHtml(s) {
      return String(s)
        .split("&").join("&amp;")
        .split("<").join("&lt;")
        .split(">").join("&gt;")
        .split('"').join("&quot;")
        .split("'").join("&#039;");
    }

    // -------------------------------------------------------------
    // LIGHTBOX - click any popup photo to enlarge, then navigate with
    // arrows / keyboard / swipe.
    // -------------------------------------------------------------
    var lightbox = document.getElementById("lightbox");
    var lightboxImg = document.getElementById("lightbox-img");
    var lightboxCaption = document.getElementById("lightbox-caption");
    var lightboxClose = document.getElementById("lightbox-close");
    var lightboxPrev = document.getElementById("lightbox-prev");
    var lightboxNext = document.getElementById("lightbox-next");
    var currentLightboxIdx = -1;

    function openLightboxAt(idx) {
      if (idx < 0 || idx >= allEntries.length) return;
      currentLightboxIdx = idx;
      var entry = allEntries[idx];
      lightboxImg.src = entry.photo;
      lightboxImg.alt = entry.location || "";
      lightboxCaption.innerHTML =
        '<span class="loc">Day ' + entry.day + ' \u00b7 ' + escapeHtml(entry.location || "") + '</span>' +
        escapeHtml(entry.caption || "");
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      lightboxPrev.disabled = idx <= 0;
      lightboxNext.disabled = idx >= allEntries.length - 1;
    }
    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      lightboxImg.src = "";
      currentLightboxIdx = -1;
    }
    function lightboxStep(delta) {
      var next = currentLightboxIdx + delta;
      if (next >= 0 && next < allEntries.length) openLightboxAt(next);
    }

    // Click a popup photo -> open lightbox at that entry
    document.addEventListener("click", function (e) {
      var img = e.target && e.target.closest ? e.target.closest(".day-popup img") : null;
      if (!img) return;
      var day = parseInt(img.getAttribute("data-day"), 10);
      var idx = allEntries.findIndex(function (x) { return x.day === day; });
      if (idx >= 0) openLightboxAt(idx);
    });

    // Prev / next buttons
    lightboxPrev.addEventListener("click", function (e) { e.stopPropagation(); lightboxStep(-1); });
    lightboxNext.addEventListener("click", function (e) { e.stopPropagation(); lightboxStep(1); });

    // Close on backdrop click or close button (not on image, caption, or arrows)
    lightbox.addEventListener("click", function (e) {
      if (e.target === lightbox || e.target === lightboxClose) closeLightbox();
    });

    // Keyboard: Esc closes, arrows navigate
    document.addEventListener("keydown", function (e) {
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      else if (e.key === "ArrowLeft") lightboxStep(-1);
      else if (e.key === "ArrowRight") lightboxStep(1);
    });

    // Touch swipe (mobile): horizontal swipe > 50px = prev/next
    var touchStartX = 0;
    var touchStartY = 0;
    lightbox.addEventListener("touchstart", function (e) {
      if (e.changedTouches && e.changedTouches[0]) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }
    }, { passive: true });
    lightbox.addEventListener("touchend", function (e) {
      if (!e.changedTouches || !e.changedTouches[0]) return;
      var dx = e.changedTouches[0].screenX - touchStartX;
      var dy = e.changedTouches[0].screenY - touchStartY;
      // Must be primarily horizontal to count as a swipe
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        lightboxStep(dx > 0 ? -1 : 1);
      }
    }, { passive: true });
  </script>
</body>
</html>
