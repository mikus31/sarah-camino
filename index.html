<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Caminos — The McNeils</title>
  <meta name="description" content="An interactive family map tracking the McNeils' pilgrimages along the Caminos de Santiago.">

  <!-- Don't index this personal page in search engines -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Theme color for mobile browser chrome -->
  <meta name="theme-color" content="#003399">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- OpenGraph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Family Caminos">
  <meta property="og:title" content="Family Caminos — The McNeils">
  <meta property="og:description" content="An interactive family map tracking the McNeils' pilgrimages along the Caminos de Santiago.">
  <meta property="og:url" content="https://mikus31.github.io/sarah-camino/">
  <meta property="og:image" content="https://mikus31.github.io/sarah-camino/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Map of northern Iberia showing the McNeils' Camino routes.">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Family Caminos — The McNeils">
  <meta name="twitter:description" content="An interactive family map tracking the McNeils' pilgrimages along the Caminos de Santiago.">
  <meta name="twitter:image" content="https://mikus31.github.io/sarah-camino/og-image.jpg">

  <!-- Leaflet CSS -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">

  <style>
    :root {
      --ink: #2b2118;
      --cream: #f7f1e8;
      --camino-blue: #003399;
      --camino-blue-soft: rgba(0, 51, 153, 0.18);
      --camino-yellow: #FFCC00;
      --past-day: #a8915a;
      --terracotta: #c0502b;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--ink); }
    #map { position: absolute; inset: 0; }

    /* Header card */
    .banner {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 500;
      background: var(--cream);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
      max-width: 420px;
      line-height: 1.35;
    }
    .banner-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .banner-header .titles { flex: 1; }
    .banner h1 {
      margin: 0 0 3px 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .banner .family-sub {
      font-size: 14px;
      color: #6b5a48;
      margin-bottom: 10px;
    }
    /* Collapse/expand toggle button (works for both banner and legend) */
    .card-toggle {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      margin: -4px -6px 0 0;
      color: #6b5a48;
      font-size: 16px;
      line-height: 1;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.2s;
    }
    .card-toggle:hover { background: rgba(0,0,0,0.06); }
    .card-toggle svg { display: block; width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s; }
    /* When card is collapsed, chevron points down (rotated 180deg from default up) */
    .banner.collapsed .card-toggle svg,
    .legend.collapsed .card-toggle svg { transform: rotate(180deg); }
    /* Collapsed state: hide the body, tighten padding */
    .banner.collapsed { padding: 10px 16px; }
    .banner.collapsed .banner-body { display: none; }
    .banner.collapsed .family-sub { margin-bottom: 0; }
    .legend.collapsed { padding: 8px 14px; }
    .legend.collapsed .legend-body { display: none; }

    /* Chip bar: one chip per journey */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 6px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px 6px 10px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      background: #ede4d4;
      color: #6b5a48;
      border: 1px solid transparent;
      transition: background 0.15s, color 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .chip:hover { background: #e2d6bf; }
    .chip .chip-swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      border: 1.5px solid rgba(0,0,0,0.15);
      box-sizing: border-box;
    }
    .chip.active {
      background: var(--cream);
      color: var(--ink);
      border-color: rgba(0,0,0,0.15);
    }
    .chip.inactive { opacity: 0.55; text-decoration: line-through; }

    /* Per-journey block in the banner */
    .journey-row {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(0,0,0,0.08);
    }
    .journey-row:first-of-type { border-top: none; padding-top: 6px; margin-top: 6px; }
    .journey-row.hidden { display: none; }
    .journey-row .name {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .journey-row .name .swatch {
      width: 16px;
      height: 5px;
      border-radius: 2px;
      display: inline-block;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
    }
    .journey-row .sub {
      font-size: 13px;
      color: #6b5a48;
      margin-top: 2px;
    }
    .journey-row .stats {
      margin-top: 5px;
      font-size: 13px;
    }
    .journey-row .stats b { font-weight: 700; }
    .journey-row .remaining {
      margin-top: 4px;
      font-size: 12px;
      color: #6b5a48;
    }
    .journey-row .remaining b { color: var(--terracotta); font-weight: 700; }
    .journey-row .weather {
      margin-top: 4px;
      font-size: 12px;
      color: #8b7765;
      font-variant-numeric: tabular-nums;
    }
    .journey-row .weather b { font-weight: 600; }
    .banner .time {
      margin-top: 10px;
      font-size: 12px;
      color: #8b7765;
      font-variant-numeric: tabular-nums;
      border-top: 1px solid rgba(0,0,0,0.08);
      padding-top: 8px;
    }
    .banner .time b { color: var(--camino-blue); font-weight: 600; }

    /* Legend (bottom-left) */
    .legend {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 500;
      background: var(--cream);
      border-radius: 10px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      font-size: 14px;
      line-height: 1.65;
      max-width: 320px;
    }
    .legend-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      color: #6b5a48;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .legend.collapsed .legend-header { font-size: 12px; }
    .legend-body { margin-top: 6px; }
    .legend .row { display: flex; align-items: center; gap: 10px; }
    .legend .swatch {
      display: inline-block;
      width: 22px;
      height: 5px;
      border-radius: 2px;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
    }
    .legend .scallop-mini {
      display: inline-block;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .legend .scallop-mini svg { display: block; width: 100%; height: 100%; }
    .legend .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.25);
      flex-shrink: 0;
    }

    /* Popup styling */
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      padding: 0;
    }
    .leaflet-popup-content {
      margin: 0;
      width: 300px !important;
    }
    .day-popup { font-family: inherit; color: var(--ink); }
    .day-popup img {
      display: block;
      width: 100%;
      height: 210px;
      object-fit: cover;
      border-radius: 10px 10px 0 0;
      background: #ddd;
      cursor: zoom-in;
    }

    /* Lightbox overlay */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(20, 15, 10, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px;
      box-sizing: border-box;
      cursor: zoom-out;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: 100%;
      max-height: calc(100% - 120px);
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    #lightbox-caption {
      color: var(--cream);
      font-size: 14px;
      margin-top: 16px;
      max-width: 720px;
      text-align: center;
      line-height: 1.5;
    }
    #lightbox-caption .loc {
      display: block;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      font-size: 15px;
    }
    #lightbox-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: transparent;
      color: var(--cream);
      font-size: 36px;
      border: none;
      cursor: pointer;
      line-height: 1;
      padding: 4px 10px;
      font-family: inherit;
    }
    #lightbox-close:hover { color: #fff; }

    #lightbox-prev, #lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.15s, opacity 0.15s;
      z-index: 1;
    }
    #lightbox-prev { left: 18px; }
    #lightbox-next { right: 18px; }
    #lightbox-prev:hover, #lightbox-next:hover { background: rgba(0, 0, 0, 0.75); }
    #lightbox-prev[disabled], #lightbox-next[disabled] {
      opacity: 0.25;
      cursor: default;
      pointer-events: none;
    }
    #lightbox-prev svg, #lightbox-next svg {
      width: 28px;
      height: 28px;
      stroke: #fff;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (max-width: 520px) {
      #lightbox-prev, #lightbox-next { width: 48px; height: 48px; }
      #lightbox-prev { left: 8px; }
      #lightbox-next { right: 8px; }
    }
    .day-popup .pad { padding: 12px 14px 14px 14px; }
    .day-popup .hdr {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      padding-right: 22px;
    }
    .day-popup .day {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .day-popup .date { font-size: 13px; color: #6b5a48; }
    .day-popup .loc { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .day-popup .pilgrim-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .day-popup .caption { font-size: 14px; line-height: 1.5; color: #3a2d22; }
    .day-popup .miles { font-size: 12px; color: #8b7765; margin-top: 6px; }

    /* Countdown block, shown inside the Day 0 popup pre-departure */
    .day-popup .countdown {
      margin: 8px 0 4px;
      padding: 10px 8px;
      background: var(--camino-blue-soft);
      border-radius: 6px;
      text-align: center;
      line-height: 1.15;
    }
    .day-popup .countdown .cnt-num {
      font-size: 28px;
      font-weight: 700;
      color: var(--camino-blue);
    }
    .day-popup .countdown .cnt-sub {
      font-size: 12px;
      color: #6b5a48;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    /* Marker styles — sized by role, colored per-journey inline */
    /* Pulsing marker: used for a journey's "live" position — the most recent
       day while walking, or the Day-0 start city for an upcoming journey.
       Color comes from --pulse-rgb ("r, g, b") set inline. */
    .pulse-marker {
      width: 22px;
      height: 22px;
      border: 3px solid #fff;
      border-radius: 50%;
      animation: pulse-any 1.8s ease-out infinite;
    }
    @keyframes pulse-any {
      0%   { box-shadow: 0 0 0 0    rgba(var(--pulse-rgb, 255, 204, 0), 0.7); }
      70%  { box-shadow: 0 0 0 22px rgba(var(--pulse-rgb, 255, 204, 0), 0);   }
      100% { box-shadow: 0 0 0 0    rgba(var(--pulse-rgb, 255, 204, 0), 0);   }
    }
    .santiago-marker, .lighthouse-marker {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.4));
    }
    .santiago-marker svg, .lighthouse-marker svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .past-marker {
      width: 12px;
      height: 12px;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
    }
    .start-marker {
      width: 16px;
      height: 16px;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.3);
    }

    /* Responsive: shrink banner on phones */
    @media (max-width: 520px) {
      .banner { max-width: calc(100% - 40px); }
      .legend { font-size: 11px; max-width: 200px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="banner" id="banner">
    <div class="banner-header">
      <div class="titles">
        <h1 id="banner-title">Family Caminos</h1>
        <div class="family-sub" id="banner-family-sub">The McNeils</div>
      </div>
      <button class="card-toggle" id="banner-toggle" aria-label="Collapse or expand" aria-expanded="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 15 12 9 18 15"></polyline></svg>
      </button>
    </div>
    <div class="banner-body">
      <div class="chips" id="chips"></div>
      <div id="journey-rows"></div>
      <div class="time" id="banner-time"></div>
    </div>
  </div>

  <div class="legend" id="legend">
    <div class="legend-header">
      <span>Legend</span>
      <button class="card-toggle" id="legend-toggle" aria-label="Collapse or expand" aria-expanded="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 15 12 9 18 15"></polyline></svg>
      </button>
    </div>
    <div class="legend-body" id="legend-body"></div>
  </div>

  <!-- Lightbox overlay (hidden until a photo is clicked) -->
  <div id="lightbox" aria-hidden="true" role="dialog">
    <button id="lightbox-close" aria-label="Close">&times;</button>
    <button id="lightbox-prev" aria-label="Previous day">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <button id="lightbox-next" aria-label="Next day">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <img id="lightbox-img" alt="">
    <div id="lightbox-caption"></div>
  </div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <!-- Turf.js for nearest-point-on-line / line-slicing -->
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <script>
    // -------------------------------------------------------------
    // CONFIG
    // -------------------------------------------------------------
    const CONFIG = {
      MAPTILER_KEY: "emnksKueX1bIKbJb2CSR",
      MAPBOX_TOKEN: "pk.eyJ1IjoibWlrdXMzMSIsImEiOiJjbW9hNjB4N28wM21uMnFvaWQ1azNpdnNuIn0.8JL2073-UWgbSYFdN4VkyA"
    };

    // Global state: array of loaded journey objects.
    // Each journey holds { config, entries, layers, visible, stats }.
    var JOURNEYS = [];
    // Combined, flat list of all entries across visible journeys (drives lightbox)
    var lightboxEntries = [];

    // Returns { days: N, pretty: "June 18" }
    function startsInText(startDateStr) {
      if (!startDateStr) return null;
      var parts = String(startDateStr).split("-");
      if (parts.length !== 3) return null;
      var start = new Date(+parts[0], +parts[1] - 1, +parts[2]);
      if (isNaN(start)) return null;
      var now = new Date();
      var startDay = new Date(start.getFullYear(), start.getMonth(), start.getDate());
      var nowDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var days = Math.round((startDay - nowDay) / 86400000);
      var pretty = start.toLocaleDateString("en-US", { month: "long", day: "numeric" });
      return { days: days, pretty: pretty };
    }

    // -------------------------------------------------------------
    // COLLAPSIBLE CARDS - both banner and legend can collapse to just
    // their header. Auto-collapse on narrow viewports so the map isn't
    // buried under UI on phones.
    // -------------------------------------------------------------
    function wireCardToggle(cardId, btnId) {
      const card = document.getElementById(cardId);
      const btn = document.getElementById(btnId);
      if (!card || !btn) return;
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        card.classList.toggle("collapsed");
        btn.setAttribute("aria-expanded", card.classList.contains("collapsed") ? "false" : "true");
      });
    }
    wireCardToggle("banner", "banner-toggle");
    wireCardToggle("legend", "legend-toggle");

    // On phones, start both cards collapsed so the map is fully visible.
    // Users tap the chevron to expand.
    if (window.matchMedia && window.matchMedia("(max-width: 520px)").matches) {
      document.getElementById("banner").classList.add("collapsed");
      document.getElementById("banner-toggle").setAttribute("aria-expanded", "false");
      document.getElementById("legend").classList.add("collapsed");
      document.getElementById("legend-toggle").setAttribute("aria-expanded", "false");
    }

    // -------------------------------------------------------------
    // INIT MAP - fit the whole Iberian peninsula initially; we
    // fitBounds() again once journey data has loaded.
    // -------------------------------------------------------------
    const map = L.map("map", {
      zoomControl: false,
      scrollWheelZoom: true
    }).setView([42.5, -6.5], 6);

    L.control.zoom({ position: "topright" }).addTo(map);

    // -------------------------------------------------------------
    // BASEMAPS
    // -------------------------------------------------------------
    const esriTopo = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
      { attribution: "Tiles &copy; Esri", maxZoom: 17 }
    );
    const esriImagery = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { attribution: "Tiles &copy; Esri", maxZoom: 19 }
    );
    function makeEsriLabelsOverlay() {
      return L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
        { attribution: "Labels &copy; Esri", maxZoom: 19, pane: "overlayPane" }
      );
    }
    const esriImageryLabeled = L.layerGroup([esriImagery, makeEsriLabelsOverlay()]);
    const maptilerAquarelle = L.tileLayer(
      "https://api.maptiler.com/maps/aquarelle/{z}/{x}/{y}.png?key=" + CONFIG.MAPTILER_KEY,
      {
        attribution: '&copy; <a href="https://www.maptiler.com/copyright/" target="_blank">MapTiler</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>',
        maxZoom: 18, tileSize: 512, zoomOffset: -1, crossOrigin: true
      }
    );
    esriImageryLabeled.addTo(map);
    const baseLayers = {
      "Esri Satellite + Labels": esriImageryLabeled,
      "Esri Topographic": esriTopo
    };
    if (CONFIG.MAPTILER_KEY) baseLayers["MapTiler Aquarelle"] = maptilerAquarelle;
    L.control.layers(baseLayers, null, { position: "topright", collapsed: true }).addTo(map);

    // -------------------------------------------------------------
    // LOAD DATA
    // -------------------------------------------------------------
    fetch("data/journeys.json")
      .then(r => r.json())
      .then(index => {
        const journeys = index.journeys || [];
        // For each journey, kick off its file fetches. Any file that fails to
        // load (or is null in the index) simply gets a null in that slot.
        return Promise.all(journeys.map(cfg => {
          const routeP = cfg.route ? fetch(cfg.route).then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null);
          const extP   = cfg.extension ? fetch(cfg.extension).then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null);
          const jrnlP  = cfg.journal ? fetch(cfg.journal).then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null);
          return Promise.all([routeP, extP, jrnlP]).then(([route, ext, jrnl]) => ({
            cfg: cfg, route: route, extension: ext, journal: jrnl
          }));
        })).then(loaded => ({ index, loaded }));
      })
      .then(({ index, loaded }) => {
        document.getElementById("banner-title").textContent = index.title || "Family Caminos";
        document.getElementById("banner-family-sub").textContent = index.family || "";
        loaded.forEach(item => JOURNEYS.push(buildJourney(item)));
        renderChips();
        renderJourneyRows();
        renderLegend();
        rebuildLightboxIndex();
        fitToVisible();
      })
      .catch(err => {
        console.error(err);
        document.getElementById("banner-family-sub").textContent = "Could not load journeys.json — see console.";
      });

    // -------------------------------------------------------------
    // BUILD A SINGLE JOURNEY (returns state object, adds layers to map)
    // -------------------------------------------------------------
    function buildJourney(item) {
      const cfg = item.cfg;
      const routeData = item.route;
      const extensionData = item.extension;
      const journal = item.journal || { entries: [] };

      // Journey-owned Leaflet layer groups. Toggling visibility just
      // add/remove-Layer's these three from the map.
      const trailLayer = L.layerGroup();
      const markersLayer = L.layerGroup();
      // startsGroup is separate so the initial "start-city dot" for
      // upcoming journeys always renders even without a route.
      const startsLayer = L.layerGroup();

      const entries = (journal.entries || []).slice().sort((a, b) => a.day - b.day);
      const walkedEntries = entries.filter(e => e.day >= 1);
      // Tag every entry with its journey so the lightbox can look up palette
      entries.forEach(e => { e._journeySlug = cfg.slug; e._journeyCfg = cfg; });

      // Derived status: an "upcoming" journey with any walked entries is
      // effectively active. Lets the pulse + auto-popup follow the most
      // recent day without needing to hand-edit journeys.json when the
      // Camino kicks off.
      if (cfg.status === "upcoming" && walkedEntries.length > 0) {
        cfg.status = "active";
      }

      // --- Route line assembly ---
      // Prefer the route.geojson; if none, we skip the walked-line entirely.
      let walkedLayer = null;
      let journeyLine = null;
      let totalRouteKm = 0;
      if (routeData && routeData.features && routeData.features.length > 0) {
        const routeLine = routeData.features[0];
        journeyLine = routeLine;
        // Splice in the extension (Fisterra-Muxía trunk) if we have it
        if (extensionData && extensionData.features && extensionData.features.length > 0) {
          const extGeom = extensionData.features[0].geometry;
          let extCoords = null;
          if (extGeom.type === "LineString") extCoords = extGeom.coordinates;
          else if (extGeom.type === "MultiLineString" && extGeom.coordinates.length > 0) extCoords = extGeom.coordinates[0];
          if (extCoords && extCoords.length > 1) {
            const combined = routeLine.geometry.coordinates.concat(extCoords.slice(1));
            journeyLine = turf.lineString(combined);
          }
        }
        totalRouteKm = turf.length(routeLine, { units: "kilometers" });

        // Draw the FULL planned route as a dashed preview line if the
        // pilgrim hasn't finished yet. This gives friends and family a way
        // to see the whole route before it's been walked. Once the journey
        // is marked "completed" the dashed line is dropped and only the
        // walked-line remains (matching Sarah's retrospective view).
        if (journeyLine && cfg.status !== "completed") {
          const plannedLayer = L.geoJSON(journeyLine, {
            interactive: false,       // don't intercept clicks on markers
            style: {
              color: cfg.palette.walked,
              weight: 3.5,
              opacity: 0.85,
              dashArray: "8, 8",
              lineCap: "round",
              lineJoin: "round"
            }
          });
          plannedLayer.addTo(trailLayer);
        }

        // Draw walked-line if we have any walked entries
        if (walkedEntries.length > 0 && journeyLine) {
          const startPt = turf.point(journeyLine.geometry.coordinates[0]);
          const latest = walkedEntries[walkedEntries.length - 1];
          const latestPt = turf.point([latest.coords[1], latest.coords[0]]);
          const snapped = turf.nearestPointOnLine(journeyLine, latestPt, { units: "kilometers" });
          const walked = turf.lineSlice(startPt, snapped, journeyLine);

          walkedLayer = L.geoJSON(walked, {
            attribution: 'Route &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
            style: {
              color: cfg.palette.walked,
              weight: 5,
              opacity: 0.95,
              lineCap: "round",
              lineJoin: "round"
            }
          });
          walkedLayer.addTo(trailLayer);
        }
      }

      // --- Markers ---
      const mostRecentDay = entries.length > 0 ? entries[entries.length - 1].day : null;

      const SCALLOP_SVG = buildScallopSvg(cfg.palette);
      const LIGHTHOUSE_SVG = buildLighthouseSvg(cfg.palette);

      entries.forEach(entry => {
        const loc = entry.location || "";
        const isSantiago = /santiago/i.test(loc);
        const isLighthouse = /mux[ií]a|fisterra|finisterre/i.test(loc);
        const isRecent = entry.day === mostRecentDay && cfg.status !== "upcoming";
        const isDayZero = entry.day === 0;
        // Anything currently "live" pulses. Two cases: an active journey's
        // most recent day, OR an upcoming journey's Day 0 start city.
        const isPulsing = (isRecent && cfg.status === "active")
                       || (isDayZero && cfg.status === "upcoming");
        const pulseRgb = hexToRgbTriple(cfg.palette.marker);

        let iconHtml, iconSize, iconAnchor, zIdx;
        if (isSantiago) {
          iconHtml = '<div class="santiago-marker">' + SCALLOP_SVG + '</div>';
          iconSize = [28, 28]; iconAnchor = [14, 14]; zIdx = 500;
        } else if (isLighthouse) {
          iconHtml = '<div class="lighthouse-marker">' + LIGHTHOUSE_SVG + '</div>';
          iconSize = [28, 28]; iconAnchor = [14, 14]; zIdx = 500;
        } else if (isPulsing) {
          iconHtml = '<div class="pulse-marker" style="background:' + cfg.palette.marker
                   + ';--pulse-rgb:' + pulseRgb + ';"></div>';
          iconSize = [22, 22]; iconAnchor = [11, 11]; zIdx = 1000;
        } else if (isDayZero) {
          // Static start-city marker (used only if this journey's Day 0 isn't already pulsing)
          iconHtml = '<div class="start-marker" style="background:' + cfg.palette.marker + ';"></div>';
          iconSize = [16, 16]; iconAnchor = [8, 8]; zIdx = 700;
        } else {
          iconHtml = '<div class="past-marker" style="background:' + (cfg.palette.pastDay || cfg.palette.marker) + ';"></div>';
          iconSize = [12, 12]; iconAnchor = [6, 6]; zIdx = 0;
        }

        const icon = L.divIcon({ className: "", html: iconHtml, iconSize: iconSize, iconAnchor: iconAnchor });
        const marker = L.marker(entry.coords, { icon: icon, zIndexOffset: zIdx, riseOnHover: true });
        marker.bindPopup(buildPopup(entry, cfg), { maxWidth: 280, minWidth: 260, closeButton: true, autoPan: true });

        // Auto-open the "live" pin on load: the most recent day of an active
        // journey, or Day 0 of an upcoming journey (start city). Skips
        // completed journeys — no popup blast on Sarah's finished map.
        if (isPulsing) {
          setTimeout(function () { marker.openPopup(); }, 700);
        }

        if (isDayZero) marker.addTo(startsLayer);
        else marker.addTo(markersLayer);
      });

      // Add layers to map by default (both journeys visible on landing)
      trailLayer.addTo(map);
      markersLayer.addTo(map);
      startsLayer.addTo(map);

      // Compute stats for the banner row
      const totalKm = walkedEntries.reduce((s, e) => s + (e.distanceKm || 0), 0);
      const totalAscentM = walkedEntries.reduce((s, e) => s + (e.ascentM || 0), 0);

      return {
        cfg: cfg,
        entries: entries,
        walkedEntries: walkedEntries,
        totalKm: totalKm,
        totalAscentM: totalAscentM,
        totalRouteKm: totalRouteKm,
        trailLayer: trailLayer,
        markersLayer: markersLayer,
        startsLayer: startsLayer,
        visible: true,
        lastWeatherCoords: null,
        lastWeatherHtml: ""
      };
    }

    // -------------------------------------------------------------
    // MILESTONE SVGs — parameterized by journey palette
    // -------------------------------------------------------------
    function buildScallopSvg(p) {
      const stroke = p.milestoneAccent || p.walked;
      const fill = p.milestoneMarker || p.marker;
      return (
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
          '<circle cx="16" cy="16" r="15" fill="#fff" stroke="' + stroke + '" stroke-width="1.5"/>' +
          '<path d="M 5 19 A 11 11 0 0 1 27 19 L 16 26 Z" fill="' + fill + '"/>' +
          '<g stroke="' + stroke + '" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">' +
            '<line x1="16" y1="24" x2="6.5" y2="18.5"/>' +
            '<line x1="16" y1="24" x2="10" y2="11"/>' +
            '<line x1="16" y1="24" x2="16" y2="8"/>' +
            '<line x1="16" y1="24" x2="22" y2="11"/>' +
            '<line x1="16" y1="24" x2="25.5" y2="18.5"/>' +
          '</g>' +
        '</svg>'
      );
    }
    function buildLighthouseSvg(p) {
      const stroke = p.milestoneAccent || p.walked;
      const light = p.milestoneMarker || p.marker;
      return (
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">' +
          '<circle cx="16" cy="16" r="15" fill="#fff" stroke="' + stroke + '" stroke-width="1.5"/>' +
          '<rect x="9" y="24" width="14" height="2" fill="' + stroke + '"/>' +
          '<polygon points="11.5,24 20.5,24 19.5,10.5 12.5,10.5" fill="#fff" stroke="' + stroke + '" stroke-width="1"/>' +
          '<rect x="12.5" y="15" width="7" height="3" fill="#c0502b"/>' +
          '<rect x="10.5" y="9.2" width="11" height="1.6" fill="' + stroke + '"/>' +
          '<rect x="13" y="5.8" width="6" height="3.6" fill="' + light + '" stroke="' + stroke + '" stroke-width="0.8"/>' +
          '<polygon points="12,5.8 20,5.8 16,2.8" fill="' + stroke + '"/>' +
        '</svg>'
      );
    }

    // -------------------------------------------------------------
    // CHIP BAR - one toggle per journey
    // -------------------------------------------------------------
    function renderChips() {
      const wrap = document.getElementById("chips");
      wrap.innerHTML = "";
      JOURNEYS.forEach((j, i) => {
        const c = document.createElement("div");
        c.className = "chip " + (j.visible ? "active" : "inactive");
        c.innerHTML =
          '<span class="chip-swatch" style="background:' + j.cfg.palette.walked + ';"></span>' +
          escapeHtml(j.cfg.pilgrim);
        c.title = j.cfg.camino;
        c.addEventListener("click", () => toggleJourney(i));
        wrap.appendChild(c);
      });
    }

    function toggleJourney(i) {
      const j = JOURNEYS[i];
      j.visible = !j.visible;
      if (j.visible) {
        j.trailLayer.addTo(map);
        j.markersLayer.addTo(map);
        j.startsLayer.addTo(map);
      } else {
        map.removeLayer(j.trailLayer);
        map.removeLayer(j.markersLayer);
        map.removeLayer(j.startsLayer);
      }
      renderChips();
      renderJourneyRows();
      renderLegend();
      rebuildLightboxIndex();
      fitToVisible();
    }

    // -------------------------------------------------------------
    // BANNER - one row per journey, weather only for single-visible
    // -------------------------------------------------------------
    function renderJourneyRows() {
      const wrap = document.getElementById("journey-rows");
      wrap.innerHTML = "";
      JOURNEYS.forEach(j => {
        if (!j.visible) return;
        const row = document.createElement("div");
        row.className = "journey-row";
        const cfg = j.cfg;

        let subText = "";
        if (cfg.status === "completed") {
          subText = cfg.camino + " · " + cfg.startCity + " → " + cfg.endCity;
        } else if (cfg.status === "active") {
          subText = cfg.camino + " · walking now";
        } else if (cfg.status === "upcoming") {
          const c = startsInText(cfg.startDate);
          if (c && c.days > 1) subText = cfg.camino + " · starts in " + c.days + " days";
          else if (c && c.days === 1) subText = cfg.camino + " · starts tomorrow";
          else if (c && c.days === 0) subText = cfg.camino + " · starts today!";
          else subText = cfg.camino;
        } else {
          subText = cfg.camino;
        }

        // Stats row (only meaningful once walking has begun)
        let statsHtml = "";
        if (j.walkedEntries.length > 0) {
          const totalDays = j.walkedEntries.length;
          const daysWord = totalDays === 1 ? "day" : "days";
          const totalMiles = kmToMiles(j.totalKm);
          const totalAscentFt = metersToFeet(j.totalAscentM);
          statsHtml = '<div class="stats"><b>' + totalDays + '</b> ' + daysWord
            + ' &middot; <b>' + totalMiles + '</b> mi'
            + (totalAscentFt > 0 ? ' &middot; <b>' + totalAscentFt.toLocaleString() + '</b> ft' : '')
            + '</div>';
        }

        row.innerHTML =
          '<div class="name"><span class="swatch" style="background:' + cfg.palette.walked
            + ';border:1px solid ' + (cfg.palette.walked === '#ffffff' ? '#999' : 'transparent') + '"></span>'
            + escapeHtml(cfg.pilgrim) + '</div>'
          + '<div class="sub">' + escapeHtml(subText) + '</div>'
          + statsHtml;
        wrap.appendChild(row);
      });

      // Weather: fetch for the "live" journey (whichever is upcoming or
      // active). Shown at the bottom of the banner, next to the clock in
      // that pilgrim's local timezone.
      const live = getLiveJourney();
      if (live && live.entries.length > 0) {
        const latest = live.entries[live.entries.length - 1];
        fetchWeatherFor(live, latest.coords[0], latest.coords[1]);
      }
      renderLiveClock();
    }

    // Returns the journey we should feature in the bottom weather/clock strip.
    // Preference: active > upcoming > most-recent completed.
    function getLiveJourney() {
      const active = JOURNEYS.find(j => j.cfg.status === "active");
      if (active) return active;
      const upcoming = JOURNEYS.find(j => j.cfg.status === "upcoming");
      if (upcoming) return upcoming;
      return JOURNEYS[JOURNEYS.length - 1] || null;
    }

    // -------------------------------------------------------------
    // LEGEND - regenerated to match visible journeys
    // -------------------------------------------------------------
    function renderLegend() {
      const wrap = document.getElementById("legend-body");
      wrap.innerHTML = "";
      const visibleJourneys = JOURNEYS.filter(j => j.visible);
      if (visibleJourneys.length === 0) {
        wrap.innerHTML = '<div class="row" style="color:#8b7765;">No journeys shown</div>';
        return;
      }
      visibleJourneys.forEach(j => {
        const row = document.createElement("div");
        row.className = "row";
        const isDashed = j.cfg.status !== "completed" && j.walkedEntries.length === 0;
        const swatch = isDashed
          ? '<span class="swatch swatch-dashed" style="border-top:3px dashed ' + j.cfg.palette.walked + ';background:transparent;box-shadow:none;height:0;"></span>'
          : '<span class="swatch" style="background:' + j.cfg.palette.walked + ';"></span>';
        const suffix = isDashed ? " (planned)" : "";
        row.innerHTML =
          swatch
          + escapeHtml(j.cfg.pilgrim) + '’s ' + escapeHtml(j.cfg.camino) + suffix;
        wrap.appendChild(row);
      });
      // Universal legend rows: what the shared icons mean
      const days = document.createElement("div");
      days.className = "row";
      days.innerHTML = '<span class="dot" style="background: #a8915a;"></span>Day marker (click!)';
      wrap.appendChild(days);
      const santiago = document.createElement("div");
      santiago.className = "row";
      santiago.innerHTML = '<span class="scallop-mini" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#fff" stroke="#003399" stroke-width="1.5"/><path d="M 5 19 A 11 11 0 0 1 27 19 L 16 26 Z" fill="#FFCC00"/><g stroke="#003399" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="16" y1="24" x2="6.5" y2="18.5"/><line x1="16" y1="24" x2="10" y2="11"/><line x1="16" y1="24" x2="16" y2="8"/><line x1="16" y1="24" x2="22" y2="11"/><line x1="16" y1="24" x2="25.5" y2="18.5"/></g></svg></span>Santiago';
      wrap.appendChild(santiago);
      // Only show the lighthouse row if a Muxía / Fisterra entry is in view
      const anyOcean = visibleJourneys.some(j => j.entries.some(e => /mux[ií]a|fisterra|finisterre/i.test(e.location || "")));
      if (anyOcean) {
        const oc = document.createElement("div");
        oc.className = "row";
        oc.innerHTML = '<span class="scallop-mini" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#fff" stroke="#003399" stroke-width="1.5"/><rect x="9" y="24" width="14" height="2" fill="#003399"/><polygon points="11.5,24 20.5,24 19.5,10.5 12.5,10.5" fill="#fff" stroke="#003399" stroke-width="1"/><rect x="12.5" y="15" width="7" height="3" fill="#c0502b"/><rect x="10.5" y="9.2" width="11" height="1.6" fill="#003399"/><rect x="13" y="5.8" width="6" height="3.6" fill="#FFCC00" stroke="#003399" stroke-width="0.8"/><polygon points="12,5.8 20,5.8 16,2.8" fill="#003399"/></svg></span>Ocean endings';
        wrap.appendChild(oc);
      }
    }

    // -------------------------------------------------------------
    // fitToVisible - Combined bounds of all visible journeys
    // -------------------------------------------------------------
    function fitToVisible() {
      const visible = JOURNEYS.filter(j => j.visible);
      if (visible.length === 0) return;
      // Build a bounds object from every marker + trail-layer bounds
      let bounds = null;
      visible.forEach(j => {
        // Trail bounds
        try {
          if (j.trailLayer.getLayers().length > 0) {
            j.trailLayer.eachLayer(function (sub) {
              const b = sub.getBounds ? sub.getBounds() : null;
              if (b) bounds = bounds ? bounds.extend(b) : L.latLngBounds(b.getSouthWest(), b.getNorthEast());
            });
          }
        } catch (e) {}
        // Marker bounds
        j.entries.forEach(e => {
          const ll = L.latLng(e.coords[0], e.coords[1]);
          bounds = bounds ? bounds.extend(ll) : L.latLngBounds(ll, ll);
        });
      });
      if (bounds) map.fitBounds(bounds, { padding: [50, 50] });
    }

    // -------------------------------------------------------------
    // WEATHER
    // -------------------------------------------------------------
    var WEATHER_CODES = {
      0:  { day: "☀️",   night: "🌙", label: "clear sky" },
      1:  { day: "🌤️", night: "🌙", label: "mostly clear" },
      2:  { day: "⛅",         night: "☁️",     label: "partly cloudy" },
      3:  { day: "☁️",   night: "☁️",     label: "overcast" },
      45: { day: "🌫️", night: "🌫️", label: "fog" },
      48: { day: "🌫️", night: "🌫️", label: "rime fog" },
      51: { day: "🌦️", night: "🌦️", label: "light drizzle" },
      53: { day: "🌦️", night: "🌦️", label: "drizzle" },
      55: { day: "🌧️", night: "🌧️", label: "heavy drizzle" },
      61: { day: "🌦️", night: "🌦️", label: "light rain" },
      63: { day: "🌧️", night: "🌧️", label: "rain" },
      65: { day: "🌧️", night: "🌧️", label: "heavy rain" },
      71: { day: "🌨️", night: "🌨️", label: "light snow" },
      73: { day: "🌨️", night: "🌨️", label: "snow" },
      75: { day: "❄️",       night: "❄️",       label: "heavy snow" },
      77: { day: "🌨️", night: "🌨️", label: "snow grains" },
      80: { day: "🌦️", night: "🌦️", label: "rain showers" },
      81: { day: "🌧️", night: "🌧️", label: "rain showers" },
      82: { day: "⛈️",       night: "⛈️",       label: "violent showers" },
      85: { day: "🌨️", night: "🌨️", label: "snow showers" },
      86: { day: "🌨️", night: "🌨️", label: "snow showers" },
      95: { day: "⛈️",       night: "⛈️",       label: "thunderstorm" },
      96: { day: "⛈️",       night: "⛈️",       label: "thunderstorm + hail" },
      99: { day: "⛈️",       night: "⛈️",       label: "thunderstorm + hail" }
    };

    function fetchWeatherFor(journey, lat, lng) {
      journey.lastWeatherCoords = [lat, lng];
      // timezone=auto: Open-Meteo resolves the IANA zone from lat/lng and
      // returns it in the response. That's the source of truth for the
      // banner clock — no manual updates required as Michael crosses the
      // Minho from Portugal into Spain (Lisbon → Madrid).
      const url = "https://api.open-meteo.com/v1/forecast"
        + "?latitude=" + encodeURIComponent(lat)
        + "&longitude=" + encodeURIComponent(lng)
        + "&current=temperature_2m,weather_code,is_day"
        + "&temperature_unit=fahrenheit"
        + "&timezone=auto";
      fetch(url)
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(data => {
          if (data && data.timezone) journey.effectiveTimezone = data.timezone;
          if (!data.current) { renderLiveClock(); return; }
          const t = Math.round(data.current.temperature_2m);
          const info = WEATHER_CODES[data.current.weather_code] || { day: "", night: "", label: "" };
          const icon = data.current.is_day === 1 ? info.day : info.night;
          journey.lastWeatherHtml = icon + ' <b>' + t + '°F</b>' + (info.label ? ' · ' + info.label : '');
          renderLiveClock();
        })
        .catch(() => {});
    }

    // Map an IANA timezone to a human country label for the banner strip
    function countryFromTz(tz) {
      if (!tz) return "";
      if (tz === "Europe/Lisbon" || tz === "Atlantic/Madeira" || tz === "Atlantic/Azores") return "Portugal";
      if (tz === "Europe/Madrid" || tz === "Africa/Ceuta" || tz === "Atlantic/Canary") return "Spain";
      if (tz === "Europe/Paris") return "France";
      if (tz === "Europe/Andorra") return "Andorra";
      // Fallback: last path segment ("Europe/Rome" → "Rome")
      const parts = String(tz).split("/");
      return parts[parts.length - 1] || "";
    }

    // Bottom strip: weather + clock for the "live" journey (currently
    // upcoming or active). Falls back to the last completed journey if none.
    // Timezone comes from the Open-Meteo response for that journey's latest
    // coords (updated every 15 min), with a config fallback for first paint.
    function renderLiveClock() {
      const el = document.getElementById("banner-time");
      if (!el) return;
      const j = getLiveJourney();
      if (!j) { el.textContent = ""; return; }
      const tz = j.effectiveTimezone || j.cfg.timezone || "Europe/Madrid";
      const country = countryFromTz(tz);
      // City to label — use the latest entry's location (falls back to the
      // journey's startCity if there are no entries yet). Trim any suffix
      // like " — the start" or ", Spain" for a cleaner label.
      let city = j.cfg.startCity || "";
      if (j.entries.length > 0) {
        const latest = j.entries[j.entries.length - 1];
        const loc = latest.location || "";
        city = loc.split(/[—,]/)[0].trim() || city;
      }
      let timeHtml = "";
      try {
        const fmt = new Intl.DateTimeFormat("en-US", {
          timeZone: tz,
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
          timeZoneName: "short"
        });
        const parts = fmt.formatToParts(new Date());
        let time = "", ampm = "", tzName = "";
        parts.forEach(p => {
          if (p.type === "hour" || p.type === "minute" || p.type === "literal") time += p.value;
          else if (p.type === "dayPeriod") ampm = p.value;
          else if (p.type === "timeZoneName") tzName = p.value;
        });
        timeHtml = '🕒 <b>' + time.trim() + ' ' + ampm + '</b> · ' + tzName;
      } catch (e) { timeHtml = ""; }

      const weatherHtml = j.lastWeatherHtml ? j.lastWeatherHtml : "";
      const cityLine = escapeHtml(city) + (country ? ' · ' + escapeHtml(country) : '');
      // Two-line strip: "<city> · <country>" then "<weather> · <time>"
      el.innerHTML =
        '<div style="font-weight:600;color:#6b5a48;">' + cityLine + '</div>'
        + '<div style="margin-top:2px;">'
          + (weatherHtml ? weatherHtml + ' · ' : '')
          + timeHtml
        + '</div>';
    }

    renderLiveClock();
    setInterval(() => {
      renderLiveClock();
      renderJourneyRows();  // refresh countdown copy for upcoming journeys
    }, 30 * 1000);
    // Refresh weather every 15 minutes for the live journey
    setInterval(() => {
      const j = getLiveJourney();
      if (j && j.lastWeatherCoords) fetchWeatherFor(j, j.lastWeatherCoords[0], j.lastWeatherCoords[1]);
    }, 15 * 60 * 1000);

    // -------------------------------------------------------------
    // HELPERS
    // -------------------------------------------------------------
    function kmToMiles(km) {
      if (!km) return 0;
      const mi = km * 0.621371;
      return mi >= 100 ? Math.round(mi) : Math.round(mi * 10) / 10;
    }
    function metersToFeet(m) {
      if (!m) return 0;
      return Math.round(m * 3.28084);
    }
    function escapeHtml(s) {
      return String(s)
        .split("&").join("&amp;")
        .split("<").join("&lt;")
        .split(">").join("&gt;")
        .split('"').join("&quot;")
        .split("'").join("&#039;");
    }

    // -------------------------------------------------------------
    // POPUP builder — now needs the journey config for palette + pilgrim tag
    // -------------------------------------------------------------
    function buildPopup(e, cfg) {
      const hasPhoto = e.photo && e.photo.length > 0;
      const photoHtml = hasPhoto
        ? '<img data-day="' + e.day + '" data-journey="' + escapeHtml(cfg.slug) + '" src="' + escapeHtml(e.photo) + '" alt="' + escapeHtml(e.location || "") + '" onerror="this.style.display=\'none\'">'
        : "";
      const miles = e.distanceKm ? '<div class="miles">' + kmToMiles(e.distanceKm) + ' miles walked</div>' : "";
      const ascent = e.ascentM ? '<div class="miles">' + metersToFeet(e.ascentM).toLocaleString() + ' ft ascent</div>' : "";
      const dayLabel = e.day === 0 ? "Start" : "Day " + e.day;
      const dayColor = cfg.palette.walked === '#ffffff' ? cfg.palette.marker : cfg.palette.walked;

      // Day 0 countdown (only for upcoming journeys)
      let countdownHtml = "";
      if (e.day === 0 && cfg.status === "upcoming") {
        const c = startsInText(cfg.startDate);
        if (c) {
          let num, sub;
          if (c.days > 1) { num = c.days + " days"; sub = "until departure"; }
          else if (c.days === 1) { num = "Tomorrow"; sub = cfg.pilgrim + " starts walking"; }
          else if (c.days === 0) { num = "Today!"; sub = "the journey begins"; }
          else { num = "Underway"; sub = "the journey has begun"; }
          countdownHtml =
            '<div class="countdown" style="background:' + hexToSoft(cfg.palette.walked === '#ffffff' ? cfg.palette.marker : cfg.palette.walked) + ';">' +
              '<div class="cnt-num" style="color:' + dayColor + ';">' + num + '</div>' +
              '<div class="cnt-sub">' + sub + '</div>' +
            '</div>';
        }
      }

      const pilgrimTagBg = cfg.palette.walked === '#ffffff' ? cfg.palette.marker : cfg.palette.walked;
      const pilgrimTag = '<span class="pilgrim-tag" style="background:' + pilgrimTagBg + ';color:#fff;">' + escapeHtml(cfg.pilgrim) + ' · ' + escapeHtml(cfg.camino) + '</span>';

      return (
        '<div class="day-popup">' +
          photoHtml +
          '<div class="pad">' +
            '<div class="hdr">' +
              '<span class="day" style="color:' + dayColor + ';">' + dayLabel + '</span>' +
              '<span class="date">' + escapeHtml(e.date || "") + '</span>' +
            '</div>' +
            pilgrimTag +
            '<div class="loc">' + escapeHtml(e.location || "") + '</div>' +
            countdownHtml +
            '<div class="caption">' + escapeHtml(e.caption || "") + '</div>' +
            miles +
            ascent +
          '</div>' +
        '</div>'
      );
    }

    // Convert #rrggbb to soft rgba(r,g,b,0.18) for countdown backgrounds
    function hexToSoft(hex) {
      const h = (hex || "#003399").replace("#", "");
      const r = parseInt(h.substring(0, 2), 16);
      const g = parseInt(h.substring(2, 4), 16);
      const b = parseInt(h.substring(4, 6), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',0.18)';
    }
    // Convert #rrggbb to a bare "r, g, b" triple for use in CSS var
    // (--pulse-rgb references it as `rgba(var(--pulse-rgb), 0.7)`)
    function hexToRgbTriple(hex) {
      const h = (hex || "#003399").replace("#", "");
      const r = parseInt(h.substring(0, 2), 16);
      const g = parseInt(h.substring(2, 4), 16);
      const b = parseInt(h.substring(4, 6), 16);
      return r + ', ' + g + ', ' + b;
    }

    // -------------------------------------------------------------
    // LIGHTBOX - unchanged behavior, but the entries list is the
    // flat cross-journey list of currently-visible entries with photos
    // -------------------------------------------------------------
    function rebuildLightboxIndex() {
      lightboxEntries = [];
      JOURNEYS.forEach(j => {
        if (!j.visible) return;
        j.entries.forEach(e => {
          if (e.photo) lightboxEntries.push(e);
        });
      });
    }

    var lightbox = document.getElementById("lightbox");
    var lightboxImg = document.getElementById("lightbox-img");
    var lightboxCaption = document.getElementById("lightbox-caption");
    var lightboxClose = document.getElementById("lightbox-close");
    var lightboxPrev = document.getElementById("lightbox-prev");
    var lightboxNext = document.getElementById("lightbox-next");
    var currentLightboxIdx = -1;

    function openLightboxAt(idx) {
      if (idx < 0 || idx >= lightboxEntries.length) return;
      currentLightboxIdx = idx;
      const entry = lightboxEntries[idx];
      lightboxImg.src = entry.photo;
      lightboxImg.alt = entry.location || "";
      const pilgrim = entry._journeyCfg ? entry._journeyCfg.pilgrim + " · " : "";
      lightboxCaption.innerHTML =
        '<span class="loc">' + escapeHtml(pilgrim) + 'Day ' + entry.day + ' · ' + escapeHtml(entry.location || "") + '</span>' +
        escapeHtml(entry.caption || "");
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      lightboxPrev.disabled = idx <= 0;
      lightboxNext.disabled = idx >= lightboxEntries.length - 1;
    }
    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      lightboxImg.src = "";
      currentLightboxIdx = -1;
    }
    function lightboxStep(delta) {
      const next = currentLightboxIdx + delta;
      if (next >= 0 && next < lightboxEntries.length) openLightboxAt(next);
    }

    document.addEventListener("click", function (e) {
      const img = e.target && e.target.closest ? e.target.closest(".day-popup img") : null;
      if (!img) return;
      const day = parseInt(img.getAttribute("data-day"), 10);
      const journeySlug = img.getAttribute("data-journey");
      const idx = lightboxEntries.findIndex(x => x.day === day && x._journeySlug === journeySlug);
      if (idx >= 0) openLightboxAt(idx);
    });

    lightboxPrev.addEventListener("click", function (e) { e.stopPropagation(); lightboxStep(-1); });
    lightboxNext.addEventListener("click", function (e) { e.stopPropagation(); lightboxStep(1); });
    lightbox.addEventListener("click", function (e) {
      if (e.target === lightbox || e.target === lightboxClose) closeLightbox();
    });
    document.addEventListener("keydown", function (e) {
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      else if (e.key === "ArrowLeft") lightboxStep(-1);
      else if (e.key === "ArrowRight") lightboxStep(1);
    });
    var touchStartX = 0, touchStartY = 0;
    lightbox.addEventListener("touchstart", function (e) {
      if (e.changedTouches && e.changedTouches[0]) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }
    }, { passive: true });
    lightbox.addEventListener("touchend", function (e) {
      if (!e.changedTouches || !e.changedTouches[0]) return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        lightboxStep(dx > 0 ? -1 : 1);
      }
    }, { passive: true });
  </script>
</body>
</html>
